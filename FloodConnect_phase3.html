 if(!/^\d{1,9}$/.test(p[0])||id<1||!PR[sev]||!ST.includes(p[7]))return null;return{id,name:p[1],loc:p[2],type:p[3],sev,desc:p[5],tel:p[6],st:p[7]}}).filter(Boolean))}

 const[id,cap,beds,food,kits]=[0,3,4,5,6].map(i=>+p[i]);if(id<1||beds>cap)return null;return{id,name:p[1],loc:p[2],cap,beds,food,kits}}).filter(Boolean))}

let S=load(),tab='home',msg='',add=false,q='';

["report,register,submit,complaint,raise emergency,add emergency,how do i ask for rescue,request rescue",

["camp,camps,shelter,relief camp,where to go,safe place,place to stay,beds,bed free,accommodation",

["evacuate,evacuation,leave home,leave house,should i leave,leave the area,order to leave",

["carry,bring,pack,emergency kit,go bag,ready bag,essentials,what to take,what should i take",

["prepare,preparation,before flood,get ready,be ready,plan ahead,precaution,precautions",

["during flood,what to do,what should i do,flood safety,safety,tips,advice,survive,stay safe,precautions during",

["electric,electricity,current,power line,shock,switch,wire,socket,short circuit,transformer",

["drive,driving,car,vehicle,bike,scooter,cross the road,cross the river,bridge,wade,walk through,causeway",

["food,eat,cook,cooking,fridge,leftover,leftovers,ration,hungry,hunger,packets",

  if(r){let s=`Report #${id} (${r.sev}) is ${r.st}.`;if(r.st==='Pending'){const n=queue(),i=n.findIndex(a=>a.id===id);if(i>=0)s+=` It is number ${i+1} of ${n.length} in the priority queue.`;s+=' A rescue team will be assigned in priority order.'}else if(r.st==='In Progress')s+=' A rescue team has been assigned.';else if(r.st==='Rescued')s+=' It is marked as rescued. If you still need help, report again or call 112.';return s}

 <div><h3>By Status</h3>${ST.map(x=>br(x,cnt(r=>r.st===x))).join('')}</div></div>
 <h3 style="margin-top:26px">Latest Active High Priority Case</h3>${h?`<div class="lc"><div><b>#${h.id} ${esc(h.name)}</b><div class="mut">${esc(h.loc)} · ${esc(h.type)}</div></div><div>${sv(h.sev)} <span class="tag">${h.st}</span></div></div>`:'<p class="mut">No active HIGH priority case right now.</p>'}${charts()}`},
rep(){return`<h2>Emergency Report Management</h2><button data-a="toggle">${add?'Cancel':'Add Report'}</button> ${U&&U.role==='citizen'?'':`<button data-a="undo" ${UN.length?'':'disabled'}>Undo (${UN.length})</button>`}
 &nbsp;Search: <input id="q" placeholder="ID, name or location" value="${esc(q)}">${msgd()}${add?repForm():''}<div id="list"></div>`},
queue(){const L=queue();return`<h2>Priority Management</h2><button data-a="process" ${L.length?'':'disabled'}>Process Highest-Priority Emergency</button>${msgd()}
 ${L.length?`<div class="w"><table><tr><th>Priority</th><th>ID</th><th>Victim</th><th>Location</th><th>Severity</th><th>Photo</th></tr>${L.map(r=>`<tr><td>${PR[r.sev]}</td><td>${r.id}</td><td>${esc(r.name)}</td><td>${esc(r.loc)}</td><td>${sv(r.sev)}</td><td>${ph(r)}</td></tr>`).join('')}</table></div><p>Emergencies waiting: ${L.length}</p>`:'<p>The priority queue is empty. Nothing to process.</p>'}`},
camps(){return`<h2>Relief Camp Management</h2><button data-a="toggle">${add?'Cancel':'Add Camp'}</button> <button data-a="undo" ${UN.length?'':'disabled'}>Undo (${UN.length})</button>${msgd()}${add?campForm():''}
 ${S.c.length?`<div class="w"><table><tr><th>ID</th><th>Name</th><th>Location</th><th>Capacity</th><th>Available Beds</th><th>Food Packets</th><th>Medical Kits</th><th></th></tr>${S.c.map(c=>`<tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.loc)}</td><td>${c.cap}</td><td><input type="number" min="0" id="b${c.id}" value="${c.beds}"></td><td><input type="number" min="0" id="f${c.id}" value="${c.food}"></td><td><input type="number" min="0" id="k${c.id}" value="${c.kits}"></td><td><button data-a="upc" data-id="${c.id}">Update</button></td></tr>`).join('')}</table></div><p>Total camps: ${S.c.length}</p>`:'<p>No relief camps found.</p>'}`},
route(){return RT()},alloc(){return AL()},img(){return IM()},login(){return LG()},
chat(){return`<h2>FloodBot</h2><div class="cb" id="cb">${chat.map(m=>`<div class="m${m.u?' u':''}">${esc(m.t)}</div>`).join('')}</div>
 <div class="cr"><input id="ci" placeholder="Ask about reports, queue, camps..." autocomplete="off"><button data-a="send">Send</button></div>
 <div class="sg">${(U&&U.role==='citizen'?CHELP:HELP).map(h=>`<button data-a="ask" data-q="${h}">${h}</button>`).join('')}</div>`},
data(){return`<h2>Data Files</h2><p>Same format as reports.txt and camps.txt (fields separated by |).</p>
 <h3>reports.txt</h3><textarea id="tr">${esc(outR())}</textarea><button data-a="lr">Load Reports</button> <button data-a="cp" data-s="#tr">Copy</button>
 <h3>camps.txt</h3><textarea id="tc">${esc(outC())}</textarea><button data-a="lc">Load Camps</button> <button data-a="cp" data-s="#tc">Copy</button>
 ${msgd()}<h3>Reset</h3><button data-a="reset">Restore Sample Data</button>`}
};
function listR(){if(U&&U.role==='citizen'){$('#list').innerHTML='<p class="mut">Submitted reports are visible to rescue teams only.</p>';return}const k=q.toLowerCase();const L=S.r.filter(r=>!k||String(r.id)===k||r.name.toLowerCase().includes(k)||r.loc.toLowerCase().includes(k));
 $('#list').innerHTML=L.length?`<div class="w"><table><tr><th>ID</th><th>Victim</th><th>Location</th><th>Type</th><th>Severity</th><th>Description</th><th>Photo</th><th>Contact</th><th>Status</th><th></th></tr>${L.map(r=>`<tr><td>${r.id}</td><td>${esc(r.name)}</td><td>${esc(r.loc)}</td><td>${esc(r.type)}</td><td>${sv(r.sev)}</td><td>${esc(r.desc)}</td><td>${ph(r)}</td><td>${esc(r.tel)}</td><td><select data-a="st" data-id="${r.id}">${ST.map(x=>`<option${x===r.st?' selected':''}>${x}</option>`).join('')}</select></td><td><button data-a="del" data-id="${r.id}">Delete</button></td></tr>`).join('')}</table></div><p>Total reports: ${S.r.length}</p>`:'<p>No reports found.</p>'}
const fr=(l,i)=>`<tr><td>${l}</td><td>${i}</td></tr>`;
function repForm(){return`<table class="f">${fr('Report ID',`<input id="f_id" type="number" value="${nextId(S.r)}">`)}${fr('Victim Name','<input id="f_name">')}${fr('Location','<input id="f_loc" list="gl" placeholder="Pick or type">')}${fr('Emergency Type','<input id="f_type">')}${fr('Severity','<select id="f_sev"><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select>')}${fr('Description','<input id="f_desc">')}${fr('Contact Number (10 digits)','<input id="f_tel" inputmode="numeric" maxlength="10">')}${fr('Photo (optional)','<input id="f_img" type="file" accept="image/*">')}</table><datalist id="gl">${Object.keys(GN).map(n=>`<option value="${n}">`).join('')}</datalist><div id="f_pvd"></div><button data-a="addr">Save Report</button>`}
function campForm(){return`<table class="f">${fr('Camp ID',`<input id="c_id" type="number" value="${nextId(S.c)}">`)}${fr('Camp Name','<input id="c_name">')}${fr('Location','<input id="c_loc" list="gl" placeholder="Pick or type">')}${fr('Capacity','<input id="c_cap" type="number" min="1">')}${fr('Available Beds','<input id="c_beds" type="number" min="0">')}${fr('Food Packets','<input id="c_food" type="number" min="0" value="0">')}${fr('Medical Kits','<input id="c_kits" type="number" min="0" value="0">')}</table><datalist id="gl">${Object.keys(GN).map(n=>`<option value="${n}">`).join('')}</datalist><button data-a="addc">Save Camp</button>`}
const v=id=>($(id).value||'').trim().replace(/\|/g,'/'),num=id=>{const s=$(id).value.trim();return/^\d{1,9}$/.test(s)?+s:-1};
const A={
toggle(){add=!add;msg='';PH='';render()},
addr(){const id=num('#f_id'),r={id,name:v('#f_name'),loc:v('#f_loc'),type:v('#f_type'),sev:$('#f_sev').value,desc:v('#f_desc'),tel:v('#f_tel'),st:'Pending',img:PH};
 if(id<1)return err('Enter a valid report ID.');if(H.has(id))return err(`Report ID ${id} already exists. Use a different ID.`);
 r.loc=canon(r.loc);if(!r.name||!r.loc||!r.type||!r.desc)return err('All fields are required.');if(!/^\d{10}$/.test(r.tel))return err('Contact number must be exactly 10 digits.');
 snap();S.r.push(r);save();add=false;PH='';msg=`?Report #${id} added to the priority queue (Priority ${PR[r.sev]}).`;render()},
st(d,el){const r=H.get(+d.id);snap();r.st=el.value;save();msg=`?Report #${r.id} is now ${r.st}.`;render()},
del(d){const r=H.get(+d.id);if(!confirm(`Delete report #${r.id} (${r.name})?`))return;snap();S.r=S.r.filter(x=>x!==r);save();msg=`?Report #${r.id} deleted.`;render()},
process(){const r=queue()[0];if(!r)return;snap();r.st='In Progress';save();msg=`?Rescue team assigned to #${r.id} ${r.name}, ${r.loc} (${r.sev}). Status: In Progress.`;render()},
addc(){const c={id:num('#c_id'),name:v('#c_name'),loc:v('#c_loc'),cap:num('#c_cap'),beds:num('#c_beds'),food:num('#c_food'),kits:num('#c_kits')};
 if(c.id<1)return err('Enter a valid camp ID.');if(S.c.some(x=>x.id===c.id))return err(`Camp ID ${c.id} already exists.`);
 c.loc=canon(c.loc);if(!c.name||!c.loc)return err('Name and location are required.');if(c.cap<1||c.beds<0||c.food<0||c.kits<0)return err('Enter whole numbers; capacity must be at least 1.');
 if(c.beds>c.cap)return err('Available beds cannot exceed capacity.');snap();S.c.push(c);save();add=false;msg=`?Camp #${c.id} added.`;render()},
upc(d){const c=S.c.find(x=>x.id==d.id),b=num('#b'+c.id),f=num('#f'+c.id),k=num('#k'+c.id);
 if(b<0||f<0||k<0)return err('Enter whole numbers, 0 or more.');if(b>c.cap)return err(`Beds cannot exceed capacity (${c.cap}).`);
 snap();c.beds=b;c.food=f;c.kits=k;save();msg=`?Camp #${c.id} updated.`;render()},
lr(){const a=parseR($('#tr').value);S.r=a;save();msg=`?Loaded ${a.length} report(s). Invalid or duplicate lines were skipped.`;render()},
lc(){const a=parseC($('#tc').value);S.c=a;save();msg=`?Loaded ${a.length} camp(s). Invalid or duplicate lines were skipped.`;render()},
cp(d){const t=$(d.s);t.select();try{navigator.clipboard.writeText(t.value);msg='?Copied.'}catch(e){msg='!Select the text and copy it manually.'}render()},
send(){const i=$('#ci'),t=i.value.trim();if(t)A.ask({q:t})},
ask(d){chat.push({u:1,t:d.q},{u:0,t:botReply(d.q)});render()},
rmap(){roadMap()},
async ai(){const o=$('#ai');if(!LC||!o)return;o.innerHTML='<p class="mut">Loading the AI model (needs internet; the first time takes a few seconds)...</p>';
 try{await ld('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');await ld('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
  MN=MN||await mobilenet.load();const pr=await MN.classify(LC,5),ws=pr.filter(p=>/lake|sea|sand ?bar|dam|boat|canoe|pier|dock|breakwater|fountain|paddle|catamaran|yawl|schooner|gondola|ship|liner|trimaran|valley|geyser|swimming/i.test(p.className)).reduce((a,p)=>a+p.probability,0),
  as=ws>=.7?'HIGH':ws>=.4?'MEDIUM':'LOW',fin=RK[as]>RK[CS]?as:CS;
  o.innerHTML=`<h3>AI detection</h3><p>Top guesses: ${pr.slice(0,3).map(p=>esc(p.className.split(',')[0])+' '+Math.round(p.probability*100)+'%').join(', ')}</p><p>Water-scene confidence: <b>${Math.round(ws*100)}%</b> (${sv(as)})</p><p>Final severity (higher of colour analysis and AI): ${sv(fin)}</p>`}
 catch(e){o.innerHTML='<p class="err">The AI model could not load. Check your internet connection and try again.</p>'}},
login(){const u=USERS[$('#lu').value.trim().toLowerCase()];if(!u||u[0]!==hs($('#lp').value))return err('Wrong username or password.');U={n:$('#lu').value.trim().toLowerCase(),role:u[1]};tab='home';msg='';chat=[{u:0,t:botHi()}];render()},
logout(){U=null;msg='';chat=[{u:0,t:STAFFHI}];render()},
apply(){const P=plan().filter(x=>x.c);if(!P.length)return;snap();P.forEach(x=>{if(x.need==='Food packet')x.c.food--;else{x.c.beds--;if(x.need!=='Bed')x.c.kits--}x.r.st='In Progress'});save();msg=`?Allocated ${P.length} emergency(ies). Camp stock updated.`;render()},
base(d,el){base=el.value;render()},
blk(d){const i=+d.id,k=S.blk.indexOf(i);k<0?S.blk.push(i):S.blk.splice(k,1);save();render()},
undo(){if(!UN.length)return;const o=JSON.parse(UN.pop());S.r=o.r;S.c=o.c;save();msg='?Last action undone.';render()},
reset(){if(!confirm('Replace all data with the sample data?'))return;S={r:parseR(SR),c:parseC(SC)};save();msg='?Sample data restored.';render()}
};
function err(m){msg='!'+m;const e=$('#msg');if(e){e.className='err';e.textContent=m}else render()}
const TT={home:'Home',dash:'Dashboard',rep:'Emergency Reports',queue:'Priority Queue',camps:'Relief Camps',route:'Rescue Routes',alloc:'Resource Allocation',img:'Flood Image Analysis',login:'Login',chat:'FloodBot Assistant',data:'Data Files'};
function render(){idx();document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('on',b.dataset.t===tab);b.style.display=U&&ROLE[U.role].includes(b.dataset.t)?'':'none'});if(!U)tab='login';else if(!ROLE[U.role].includes(tab))tab='home';$('#um').innerHTML=U?`<p class="mut">${esc(U.n)} (${U.role})</p><button data-a="logout" style="padding:9px 14px;border:0;border-radius:10px;background:var(--acc2);color:var(--acc);font:inherit;cursor:pointer">Logout</button>`:'';
 $('#pt').textContent=TT[tab];$('#main').innerHTML=V[tab]();if(tab==='rep')listR();if(tab==='chat'){const b=$('#cb');b.scrollTop=b.scrollHeight;if(chat.length>1)$('#ci').focus()}}
document.addEventListener('click',e=>{const z=e.target.closest('img[data-z]');if(z){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:9;cursor:zoom-out';o.innerHTML=`<img src="${z.src}" alt="report photo" style="max-width:92vw;max-height:92vh;border-radius:10px">`;o.onclick=()=>o.remove();document.body.appendChild(o);return}
 const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;add=false;msg='';render();scrollTo(0,0);return}
 const b=e.target.closest('button[data-a]');if(b&&perm(b.dataset.a))A[b.dataset.a](b.dataset,b)});
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&e.target.dataset.a&&perm(e.target.dataset.a))A[e.target.dataset.a](e.target.dataset,e.target)});
document.addEventListener('change',e=>{if(e.target.id==='f_img'){const f=e.target.files[0];if(!f){PH='';$('#f_pvd').innerHTML='';return}shrink(f,d=>{PH=d;$('#f_pvd').innerHTML=d?`<img src="${d}" alt="preview" style="max-width:200px;border-radius:10px;margin:8px 0;display:block">`:'<p class="err">This photo could not be read. Use a JPG or PNG.</p>'})}});
document.addEventListener('change',e=>{if(e.target.id==='im'&&e.target.files[0])imgScan(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim();listR()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp')A.login();if(e.key==='Enter'&&e.target.id==='ci')A.send()});
render();
</script></body></html>
